name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Manifest version consistency
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          plugin_ver=$(grep -m1 '^version' herdr-plugin.toml | sed 's/.*= *"\(.*\)"/\1/')
          test "$cargo_ver" = "$plugin_ver" || {
            echo "version mismatch: Cargo.toml=$cargo_ver herdr-plugin.toml=$plugin_ver" >&2
            exit 1
          }
      - name: Release build
        run: cargo build --release
      - name: Launcher smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          sh bin/herdr-auto-update --version
          sh scripts/install-cli-shim.sh
          test -x "$HOME/.local/bin/herdr-auto-update" || { echo "PATH shim missing"; exit 1; }
          # End-to-end resolver check: a fake `herdr` on PATH that reports
          # this checkout's manifest_path, so the shim resolves the launcher
          # and runs it (the resolver's herdr fallback path).
          FAKE=$(mktemp -d)
          # Heredoc body MUST stay at the run-block indentation (YAML block
          # scalar); the generated file then has leading spaces, which is
          # fine for a script invoked via ENOEXEC shell fallback.
          cat > "$FAKE/herdr" <<'EOF'
          #!/bin/sh
          if [ "$1" = "plugin" ] && [ "$2" = "list" ]; then
            printf '{"id":"cli:plugin","result":{"plugins":[{"plugin_id":"herdr-auto-update","manifest_path":"%s/herdr-plugin.toml"}]}}' "$PWD"
            echo
            exit 0
          fi
          exit 1
EOF
          chmod +x "$FAKE/herdr"
          PATH="$FAKE:$PATH" "$HOME/.local/bin/herdr-auto-update" --version
      - name: Launcher syntax check (unix)
        if: runner.os != 'Windows'
        run: sh -n bin/herdr-auto-update
