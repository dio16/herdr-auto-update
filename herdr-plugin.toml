id = "herdr-auto-update"
name = "herdr-auto-update"
version = "1.0.9"
min_herdr_version = "0.7.0"
description = "Check installed herdr plugins for newer upstream commits and reinstall them; optionally runs automatically at herdr startup"
platforms = ["linux", "macos", "windows"]

# The [[build]] steps below are NOT compilation - they install the standalone
# CLI shim (~/.local/bin/herdr-auto-update / WindowsApps .cmd) so the command
# works from a shell right after `herdr plugin install`. No Rust toolchain is
# required: the real binary is downloaded by the bin/ launcher shim from
# GitHub Releases on first run, verified against its SHA256 checksum
# (see .github/workflows/release.yml). The scripts are best-effort and always
# exit 0, so a read-only home never fails the install.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/install-cli-shim.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install-cli-shim.ps1"]

# Auto check + reinstall at herdr server startup (respects config auto_update).
[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-auto-update", "startup"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-auto-update.ps1", "startup"]

# Manual actions. Action ids must be unique inside the plugin (herdr rejects
# duplicates regardless of platform), so only the Windows entries get a
# `-windows` suffix; macOS shares the POSIX entries.
[[actions]]
id = "check"
title = "Check herdr plugin updates"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-auto-update", "check"]

[[actions]]
id = "check-windows"
title = "Check herdr plugin updates"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-auto-update.ps1", "check"]

[[actions]]
id = "update"
title = "Update herdr plugins"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-auto-update", "update"]

[[actions]]
id = "update-windows"
title = "Update herdr plugins"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-auto-update.ps1", "update"]
